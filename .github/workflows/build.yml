name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore BloodLine.sln
      - run: dotnet build BloodLine.sln --no-restore --configuration Release
      - run: dotnet run --project tests/BloodLine.Tests --configuration Release --no-build
